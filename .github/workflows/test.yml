name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          set -euo pipefail
          for file in install.sh bin/* scripts/*.sh tests/*.sh; do
            bash -n "$file"
          done

      - name: Run behavior tests
        run: tests/run-tests.sh
